name: Generar snake de contribuciones

on:
  schedule:
    - cron: "0 5 * * *" # todos los días a las 00:00 hora Perú (UTC-5)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generar SVG del snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3D8FFF&color_dots=#ebedf0,#c6dcff,#8cc0ff,#3d8fff,#2f79e0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3D8FFF&color_dots=#161b22,#0d2a57,#15479a,#2f79e0,#3d8fff

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
